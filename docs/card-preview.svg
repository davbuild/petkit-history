<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 580" width="440" height="580" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">
  <defs>
    <!-- Card shadow -->
    <filter id="shadow" x="-5%" y="-3%" width="110%" height="112%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="rgba(0,0,0,0.12)"/>
    </filter>
    <!-- Photo gradients simulating cat eat photos -->
    <linearGradient id="photo1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3a3228"/>
      <stop offset="40%" stop-color="#6b5c44"/>
      <stop offset="100%" stop-color="#8c7055"/>
    </linearGradient>
    <linearGradient id="photo2a" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2e2e2e"/>
      <stop offset="60%" stop-color="#555"/>
      <stop offset="100%" stop-color="#7a6a58"/>
    </linearGradient>
    <linearGradient id="photo2b" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3c3c3c"/>
      <stop offset="50%" stop-color="#6b5c44"/>
      <stop offset="100%" stop-color="#8c7c64"/>
    </linearGradient>
    <linearGradient id="photoBowl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a8966c"/>
      <stop offset="100%" stop-color="#7a6844"/>
    </linearGradient>
    <clipPath id="photo1clip">
      <rect x="16" y="174" width="408" height="162" rx="10"/>
    </clipPath>
    <clipPath id="photo2aclip">
      <rect x="16" y="430" width="196" height="114" rx="8"/>
    </clipPath>
    <clipPath id="photo2bclip">
      <rect x="220" y="430" width="196" height="114" rx="8"/>
    </clipPath>
  </defs>

  <!-- Card background -->
  <rect x="10" y="10" width="420" height="560" rx="16" fill="white" filter="url(#shadow)"/>

  <!-- ── Header ── -->
  <text x="26" y="48" font-size="17" font-weight="700" fill="#1a1a1a">Mi gato hoy</text>
  <!-- Refresh icon -->
  <text x="406" y="48" font-size="17" fill="#bbb" text-anchor="middle">↻</text>

  <!-- ── Tabs ── -->
  <line x1="10" y1="72" x2="430" y2="72" stroke="#f0f0f0" stroke-width="1"/>
  <!-- Tab: Todo -->
  <text x="26" y="63" font-size="13" font-weight="600" fill="#bbb">Todo <tspan font-size="11" opacity=".7">18</tspan></text>
  <!-- Tab: Aparecer -->
  <text x="95" y="63" font-size="13" font-weight="600" fill="#bbb">Aparecer <tspan font-size="11" opacity=".7">13</tspan></text>
  <!-- Tab: Comida (active) -->
  <text x="194" y="63" font-size="13" font-weight="600" fill="#FF6B35">Comida <tspan font-size="11" opacity=".7">5</tspan></text>
  <line x1="194" y1="71" x2="249" y2="71" stroke="#FF6B35" stroke-width="2"/>
  <!-- Tab: Alimentación -->
  <text x="268" y="63" font-size="13" font-weight="600" fill="#bbb">Alimentación <tspan font-size="11" opacity=".7">3</tspan></text>

  <!-- ── Item 1: Eat event ── -->
  <text x="26" y="100" font-size="15" font-weight="700" fill="#1a1a1a">10:46</text>
  <text x="78" y="100" font-size="15" font-weight="700" fill="#1a1a1a">Mascota comiendo</text>
  <text x="26" y="116" font-size="12" fill="#bbb">El ritual sagrado de la comida.</text>

  <!-- Photo 1 -->
  <rect x="16" y="124" width="408" height="162" rx="10" fill="url(#photo1)" clip-path="url(#photo1clip)"/>
  <!-- Simulated cat shape (silhouette) -->
  <ellipse cx="200" cy="165" rx="55" ry="48" fill="rgba(20,15,10,0.55)" clip-path="url(#photo1clip)"/>
  <ellipse cx="175" cy="128" rx="20" ry="18" fill="rgba(20,15,10,0.5)" clip-path="url(#photo1clip)"/>
  <ellipse cx="225" cy="126" rx="20" ry="18" fill="rgba(20,15,10,0.5)" clip-path="url(#photo1clip)"/>
  <!-- Cat ears -->
  <polygon points="165,118 170,105 180,120" fill="rgba(20,15,10,0.5)" clip-path="url(#photo1clip)"/>
  <polygon points="218,118 225,105 232,120" fill="rgba(20,15,10,0.5)" clip-path="url(#photo1clip)"/>
  <!-- Bowl -->
  <ellipse cx="200" cy="258" rx="80" ry="14" fill="url(#photoBowl)" clip-path="url(#photo1clip)"/>
  <rect x="130" y="244" width="140" height="14" rx="4" fill="#8c7655" clip-path="url(#photo1clip)"/>
  <!-- Timestamp overlay -->
  <rect x="310" y="267" width="106" height="16" rx="3" fill="rgba(0,0,0,0.45)"/>
  <text x="313" y="279" font-size="9.5" fill="rgba(255,255,255,.85)" font-variant-numeric="tabular-nums">PETKIT 28/8/2026 10:46</text>

  <!-- Separator -->
  <line x1="10" y1="298" x2="430" y2="298" stroke="#f2f2f2" stroke-width="1"/>

  <!-- ── Item 2: Dish comparison ── -->
  <text x="26" y="326" font-size="15" font-weight="700" fill="#1a1a1a">08:02</text>
  <text x="78" y="326" font-size="15" font-weight="700" fill="#1a1a1a">Comparación de platos de comida</text>

  <!-- Photo Before -->
  <rect x="16" y="338" width="196" height="114" rx="8" fill="url(#photo2a)" clip-path="url(#photo2aclip)"/>
  <!-- Empty bowl (full) -->
  <ellipse cx="114" cy="393" rx="52" ry="12" fill="rgba(160,130,80,0.6)" clip-path="url(#photo2aclip)"/>
  <rect x="68" y="381" width="92" height="12" rx="3" fill="rgba(160,130,80,0.5)" clip-path="url(#photo2aclip)"/>
  <!-- Kibble dots -->
  <circle cx="96" cy="386" r="4" fill="rgba(200,170,110,0.7)" clip-path="url(#photo2aclip)"/>
  <circle cx="110" cy="382" r="3.5" fill="rgba(200,170,110,0.7)" clip-path="url(#photo2aclip)"/>
  <circle cx="125" cy="385" r="4" fill="rgba(200,170,110,0.7)" clip-path="url(#photo2aclip)"/>
  <circle cx="138" cy="383" r="3" fill="rgba(200,170,110,0.7)" clip-path="url(#photo2aclip)"/>
  <text x="114" y="462" font-size="11" fill="#bbb" text-anchor="middle">Antes</text>

  <!-- Photo After -->
  <rect x="220" y="338" width="196" height="114" rx="8" fill="url(#photo2b)" clip-path="url(#photo2bclip)"/>
  <!-- Empty bowl (empty) -->
  <ellipse cx="318" cy="393" rx="52" ry="12" fill="rgba(90,80,68,0.7)" clip-path="url(#photo2bclip)"/>
  <rect x="272" y="381" width="92" height="12" rx="3" fill="rgba(90,80,68,0.6)" clip-path="url(#photo2bclip)"/>
  <text x="318" y="462" font-size="11" fill="#bbb" text-anchor="middle">Después</text>

  <!-- Separator -->
  <line x1="10" y1="478" x2="430" y2="478" stroke="#f2f2f2" stroke-width="1"/>

  <!-- ── Item 3: Drink ── -->
  <text x="26" y="506" font-size="15" font-weight="700" fill="#1a1a1a">07:15</text>
  <text x="78" y="506" font-size="15" font-weight="700" fill="#1a1a1a">Mascota bebiendo</text>
  <text x="26" y="522" font-size="12" fill="#bbb">El agua más deliciosa del mundo.</text>

  <!-- Scrollbar hint -->
  <rect x="428" y="90" width="3" height="80" rx="1.5" fill="#e0e0e0"/>
</svg>
