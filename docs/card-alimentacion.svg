<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 500" width="440" height="500" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">
  <defs>
    <filter id="shadow" x="-5%" y="-3%" width="110%" height="112%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="rgba(0,0,0,0.12)"/>
    </filter>
    <linearGradient id="feedphoto1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2c2820"/>
      <stop offset="45%" stop-color="#5a4e38"/>
      <stop offset="100%" stop-color="#7a6a50"/>
    </linearGradient>
    <linearGradient id="feedphoto2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e2018"/>
      <stop offset="50%" stop-color="#4a5038"/>
      <stop offset="100%" stop-color="#6a6a50"/>
    </linearGradient>
    <clipPath id="fp1clip">
      <rect x="16" y="160" width="408" height="120" rx="10"/>
    </clipPath>
    <clipPath id="fp2clip">
      <rect x="16" y="340" width="408" height="104" rx="10"/>
    </clipPath>
  </defs>

  <!-- Card background -->
  <rect x="10" y="10" width="420" height="480" rx="16" fill="white" filter="url(#shadow)"/>

  <!-- ── Header ── -->
  <text x="26" y="48" font-size="17" font-weight="700" fill="#1a1a1a">Mi gato hoy</text>
  <text x="406" y="48" font-size="17" fill="#bbb" text-anchor="middle">↻</text>

  <!-- ── Tabs ── -->
  <line x1="10" y1="72" x2="430" y2="72" stroke="#f0f0f0" stroke-width="1"/>
  <text x="26" y="63" font-size="13" font-weight="600" fill="#bbb">Todo <tspan font-size="11" opacity=".7">21</tspan></text>
  <text x="95" y="63" font-size="13" font-weight="600" fill="#bbb">Aparecer <tspan font-size="11" opacity=".7">13</tspan></text>
  <text x="194" y="63" font-size="13" font-weight="600" fill="#bbb">Comida <tspan font-size="11" opacity=".7">5</tspan></text>
  <!-- Alimentación active -->
  <text x="262" y="63" font-size="13" font-weight="600" fill="#FF6B35">Alimentación <tspan font-size="11" opacity=".7">3</tspan></text>
  <line x1="262" y1="71" x2="380" y2="71" stroke="#FF6B35" stroke-width="2"/>

  <!-- ── Item 1: 21:00 Dispensado ── -->
  <text x="26" y="100" font-size="15" font-weight="700" fill="#1a1a1a">21:00</text>
  <text x="86" y="100" font-size="15" font-weight="700" fill="#1a1a1a">2 porción(es)</text>
  <!-- Badge: Dispensado -->
  <rect x="232" y="84" width="80" height="20" rx="10" fill="#4CAF50"/>
  <text x="272" y="98" font-size="10" font-weight="700" fill="white" text-anchor="middle">Dispensado</text>

  <!-- Feed photo 1 -->
  <rect x="16" y="112" width="408" height="120" rx="10" fill="url(#feedphoto1)" clip-path="url(#fp1clip)"/>
  <!-- Feeder device silhouette -->
  <rect x="150" y="140" width="140" height="70" rx="8" fill="rgba(20,15,10,0.4)" clip-path="url(#fp1clip)"/>
  <ellipse cx="220" cy="140" rx="30" ry="8" fill="rgba(20,15,10,0.5)" clip-path="url(#fp1clip)"/>
  <!-- Bowl with food -->
  <ellipse cx="220" cy="210" rx="60" ry="12" fill="rgba(160,130,80,0.7)" clip-path="url(#fp1clip)"/>
  <rect x="165" y="198" width="110" height="12" rx="4" fill="rgba(140,110,60,0.6)" clip-path="url(#fp1clip)"/>
  <!-- Kibble dots -->
  <circle cx="198" cy="202" r="4" fill="rgba(200,170,110,0.8)" clip-path="url(#fp1clip)"/>
  <circle cx="212" cy="199" r="3.5" fill="rgba(200,170,110,0.8)" clip-path="url(#fp1clip)"/>
  <circle cx="228" cy="201" r="4" fill="rgba(200,170,110,0.8)" clip-path="url(#fp1clip)"/>
  <circle cx="242" cy="199" r="3" fill="rgba(200,170,110,0.8)" clip-path="url(#fp1clip)"/>
  <!-- Timestamp -->
  <rect x="302" y="219" width="114" height="16" rx="3" fill="rgba(0,0,0,0.45)"/>
  <text x="305" y="231" font-size="9.5" fill="rgba(255,255,255,.85)" font-variant-numeric="tabular-nums">PETKIT 28/8/2026 21:00</text>

  <!-- Separator -->
  <line x1="10" y1="246" x2="430" y2="246" stroke="#f2f2f2" stroke-width="1"/>

  <!-- ── Item 2: 14:00 Dispensado ── -->
  <text x="26" y="274" font-size="15" font-weight="700" fill="#1a1a1a">14:00</text>
  <text x="86" y="274" font-size="15" font-weight="700" fill="#1a1a1a">1 porción(es)</text>
  <rect x="214" y="258" width="80" height="20" rx="10" fill="#4CAF50"/>
  <text x="254" y="272" font-size="10" font-weight="700" fill="white" text-anchor="middle">Dispensado</text>

  <!-- Feed photo 2 -->
  <rect x="16" y="284" width="408" height="104" rx="10" fill="url(#feedphoto2)" clip-path="url(#fp2clip)"/>
  <!-- Bowl -->
  <ellipse cx="220" cy="367" rx="58" ry="11" fill="rgba(150,120,70,0.7)" clip-path="url(#fp2clip)"/>
  <rect x="166" y="356" width="108" height="11" rx="4" fill="rgba(130,100,55,0.6)" clip-path="url(#fp2clip)"/>
  <circle cx="202" cy="360" r="4" fill="rgba(190,160,100,0.8)" clip-path="url(#fp2clip)"/>
  <circle cx="218" cy="357" r="3.5" fill="rgba(190,160,100,0.8)" clip-path="url(#fp2clip)"/>
  <circle cx="232" cy="359" r="4" fill="rgba(190,160,100,0.8)" clip-path="url(#fp2clip)"/>
  <rect x="302" y="376" width="114" height="16" rx="3" fill="rgba(0,0,0,0.45)"/>
  <text x="305" y="388" font-size="9.5" fill="rgba(255,255,255,.85)" font-variant-numeric="tabular-nums">PETKIT 28/8/2026 14:00</text>

  <!-- Separator -->
  <line x1="10" y1="402" x2="430" y2="402" stroke="#f2f2f2" stroke-width="1"/>

  <!-- ── Item 3: 06:30 Pendiente ── -->
  <text x="26" y="430" font-size="15" font-weight="700" fill="#1a1a1a">06:30</text>
  <text x="86" y="430" font-size="15" font-weight="700" fill="#1a1a1a">1 porción(es)</text>
  <!-- Badge: Pendiente -->
  <rect x="214" y="414" width="74" height="20" rx="10" fill="#FF6B35"/>
  <text x="251" y="428" font-size="10" font-weight="700" fill="white" text-anchor="middle">Pendiente</text>

  <!-- Scrollbar hint -->
  <rect x="428" y="90" width="3" height="60" rx="1.5" fill="#e0e0e0"/>
</svg>
